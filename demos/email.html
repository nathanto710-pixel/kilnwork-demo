<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lowtide Coffee - sample email</title>
<link rel="stylesheet" href="demo.css">
<style>
  .stagew{display:flex;gap:34px;justify-content:center;align-items:flex-start;padding:30px 20px 60px;max-width:1060px;margin:0 auto}
  .desk{flex:1;max-width:640px;border-radius:18px;background:#1a1a1d;box-shadow:0 0 0 1px var(--line),0 50px 110px -30px #000,0 0 140px -60px rgba(255,138,76,.6);overflow:hidden}
  .desk__bar{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .desk__bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16)}
  .desk__sub{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .desk__sub b{display:block;color:var(--ink);font-weight:500;font-size:15px}
  .desk iframe{display:block;width:100%;height:640px;border:0;background:#ece6da}
  .phone{flex:none;width:300px;padding:10px;border-radius:44px;background:#1a1a1d;box-shadow:0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 2px #000,0 50px 110px -30px #000;position:relative;margin-top:44px}
  .phone::before{content:"";position:absolute;left:50%;top:20px;width:84px;height:22px;margin-left:-42px;border-radius:999px;background:#000;z-index:2}
  .phone iframe{display:block;width:100%;height:580px;border:0;border-radius:35px;background:#ece6da}
  .lblrow{text-align:center;margin-top:12px;font:400 11.5px "Geist Mono",monospace;color:var(--faint)}
  @media (max-width:860px){.desk{display:none}.phone{margin-top:0}}
</style>
</head>
<body>
<div class="note">Sample output. Lowtide Coffee is a fictional brand made up for this demo.</div>
<div class="stagew">
  <div class="desk">
    <div class="desk__bar"><i></i><i></i><i></i></div>
    <div class="desk__sub"><b>Your beans were still green on Monday</b>Lowtide Coffee, to you</div>
    <iframe src="email-raw.html" title="Email on a computer"></iframe>
  </div>
  <div>
    <div class="phone"><iframe src="email-raw.html" title="Email on a phone"></iframe></div>
    <p class="lblrow">Same email, on a phone</p>
  </div>
</div>
</body>
</html>
