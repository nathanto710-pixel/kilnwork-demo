<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample output</title>
<link rel="stylesheet" href="demo.css">
<style>
  .doc{max-width:820px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .tabs button{padding:9px 16px;border:0;border-radius:999px;font:500 14px "Geist",sans-serif;color:var(--muted);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .3s,color .3s}
  .tabs button.on{color:#170b04;background:linear-gradient(180deg,#ffd9b8,#ff9a5f);box-shadow:none}
  .sheet{margin-top:18px;padding:34px 36px 40px;border-radius:22px;background:#fbf9f4;color:#1b1611;box-shadow:0 40px 90px -30px #000,0 0 120px -50px rgba(255,138,76,.6)}
  .sheet h2{font:400 34px/1.1 "Instrument Serif",serif;margin:26px 0 10px}
  .sheet h2:first-child{margin-top:0}
  .sheet h3{font:600 12px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#a04a1c;margin:24px 0 8px}
  .sheet p{margin:0 0 14px;font-size:16.5px;line-height:1.55;white-space:pre-wrap}
  .sheet ul{margin:0 0 14px 20px;font-size:16px;line-height:1.5}
  .sheet li{margin-bottom:6px}
  .sheet table{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14px}
  .sheet th,.sheet td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid #e6dfd0}
  .sheet th{font:600 11px "Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:#8b8274}
  .sheet code{font:500 13.5px "Geist Mono",monospace;background:#f1ece0;padding:1px 5px;border-radius:5px}
  .sheet strong{font-weight:600}
  .sheet hr{border:0;border-top:1px solid #e6dfd0;margin:22px 0}
  .scrollx{overflow-x:auto}
  .by{margin-top:14px;font:400 12px "Geist Mono",monospace;color:var(--faint)}
  @media (max-width:600px){.sheet{padding:24px 20px 28px}.sheet h2{font-size:28px}}
</style>
</head>
<body>
<div class="note" id="note"></div>
<main class="doc">
  <span class="lbl" id="lbl"></span>
  <h1 id="title" style="margin-top:8px"></h1>
  <div class="tabs" id="tabs"></div>
  <div class="sheet" id="sheet"></div>
  <p class="by" id="by"></p>
</main>
<script>
const SETS = {
  script:   { lbl: 'Script writer', title: 'A 30 second script, <em>ready to film.</em>', skill: 'script-writer', files: [['Script', 'real/text/script.md']] },
  content:  { lbl: 'Content repurposer', title: 'One source, <em>every channel.</em>', skill: 'content-repurposer', files: [['LinkedIn', 'real/text/pack-linkedin.txt'], ['Instagram caption', 'real/text/pack-instagram-caption.txt'], ['Thread', 'real/text/pack-thread.txt'], ['Newsletter opener', 'real/text/pack-newsletter-opener.txt'], ['Pull quotes', 'real/text/pack-pull-quotes.txt'], ['Video script', 'real/text/pack-video-script.md']] },
  linkedin: { lbl: 'LinkedIn writer', title: 'Three posts, <em>three angles.</em>', skill: 'linkedin-writer', files: [['Story', 'real/text/linkedin-1.txt'], ['Contrarian', 'real/text/linkedin-2.txt'], ['How-to', 'real/text/linkedin-3.txt']] },
  hooks:    { lbl: 'Hook lab', title: 'Opening lines, <em>scored and filtered.</em>', skill: 'hook-lab', files: [['Hooks', 'real/text/hooks.md']] },
  planner:  { lbl: 'Content planner', title: 'A plan that fits <em>your real hours.</em>', skill: 'content-planner', files: [['Calendar', 'real/text/calendar.md']] },
  research: { lbl: 'Competitor watch', title: 'What they posted, <em>and the gaps.</em>', skill: 'competitor-watch', files: [['Report', 'real/text/competitor-report.md']],
              note: 'Sample report built from made-up channels and numbers. This skill is still in testing.' },
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
/* small, safe renderer for the plain files the skills write: headings, lists, tables, paragraphs */
function render(text, isMd) {
  if (!isMd) return text.trim().split(/\n{2,}/).map((p) => '<p>' + esc(p) + '</p>').join('');
  const out = []; const lines = text.replace(/\r/g, '').split('\n'); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^#{1,2}\s/.test(l)) { out.push('<h2>' + inline(l.replace(/^#+\s/, '')) + '</h2>'); i++; continue; }
    if (/^#{3,}\s/.test(l)) { out.push('<h3>' + inline(l.replace(/^#+\s/, '')) + '</h3>'); i++; continue; }
    if (/^---+$/.test(l.trim())) { out.push('<hr>'); i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const body = rows.filter((r) => !/^\|[\s:|-]+\|?$/.test(r));
      out.push('<div class="scrollx"><table><tr>' + cells(body[0]).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr>' +
        body.slice(1).map((r) => '<tr>' + cells(r).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table></div>');
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const items = []; while (i < lines.length && /^\s*([-*]|\d+\.)\s/.test(lines[i])) { items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s/, '')); i++; }
      out.push('<ul>' + items.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>'); continue;
    }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#|\||\s*([-*]|\d+\.)\s)/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push('<p>' + inline(para.join('\n')) + '</p>');
  }
  return out.join('');
}
const set = SETS[new URLSearchParams(location.search).get('set')] || SETS.script;
document.getElementById('note').textContent = set.note || 'Sample output. Lowtide Coffee is a fictional brand made up for this demo.';
document.getElementById('lbl').textContent = set.lbl;
document.getElementById('title').innerHTML = set.title;
document.getElementById('by').textContent = 'Written by the ' + set.skill + ' skill and shown as it came out, unedited.';
const tabs = document.getElementById('tabs'), sheet = document.getElementById('sheet');
const show = async (idx) => {
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === idx));
  const [, path] = set.files[idx];
  try { const t = await (await fetch(path)).text(); sheet.innerHTML = render(t, path.endsWith('.md')); }
  catch (e) { sheet.textContent = 'This sample could not be loaded.'; }
};
set.files.forEach(([name], i) => { const b = document.createElement('button'); b.textContent = name; b.onclick = () => show(i); tabs.append(b); });
if (set.files.length < 2) tabs.style.display = 'none';
show(0);
</script>
</body>
</html>
